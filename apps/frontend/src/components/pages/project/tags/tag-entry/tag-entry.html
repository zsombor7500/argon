<td class="flex flex-row space-x-1 items-center flex-1 justify-center">
  @if (!isDeleting) {
    <button
      type="button"
      (click)="isDeleting = true"
      class="bg-warning-10 hover:bg-warning-0 text-surface-20 hover:text-surface-10 font-bold py-0 px-2 rounded-md transition duration-200 cursor-pointer"
    >
      Delete
    </button>
  } @else {
    <button
      type="button"
      (click)="onConfirmDelete()"
      class="bg-danger-10 hover:bg-danger-0 text-surface-20 hover:text-surface-10 font-bold py-0 px-2 rounded-md transition duration-200 cursor-pointer"
    >
      Confirm
    </button>
    <button
      type="button"
      (click)="isDeleting = false"
      class="bg-success-10 hover:bg-success-0 text-surface-20 hover:text-surface-10 font-bold py-0 px-2 rounded-md transition duration-200 cursor-pointer"
    >
      Cancel
    </button>
  }
</td>
<td class="px-2 text-center rounded-md hover:bg-surface-50/30 ransition duration-200">{{ tag.name }}</td>
<td class="px-2 text-center rounded-md hover:bg-surface-50/30 ransition duration-200">{{ tag._id }}</td>
<td class="px-2 text-center rounded-md hover:bg-surface-50/30 ransition duration-200">{{ tag.type }}</td>
<td class="px-2 text-left rounded-md hover:bg-surface-50/30 ransition duration-200">{{ tag.description ?? '-' }}</td>
<td class="px-2 text-right rounded-md hover:bg-surface-50/30 ransition duration-200">{{ tag.createdAt | date }}</td>
