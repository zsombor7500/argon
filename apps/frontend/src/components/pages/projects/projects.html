<div class="md:h-full bg-surface-0 flex flex-col md:flex-row">
  <aside class="flex-1 md:max-w-3xs bg-surface-20 flex flex-col px-5">
    <div class=" pt-5 pb-2">
      <h2 class="text-2xl font-bold text-light-0">Projects</h2>
    </div>

    <nav class="md:max-w-3xs p-0 space-y-2">
      <a
        routerLink="./"
        routerLinkActive=""
        class="block px-4 py-2 text-primary-20 rounded-md hover:bg-surface-30 transition duration-200"
      >
        Active projects
      </a>
      <a
        routerLink="./new"
        routerLinkActive=""
        class="block px-4 py-2 text-primary-20 rounded-md hover:bg-surface-30 transition duration-200"
      >
        New project
      </a>
      <a
        routerLink="./invites"
        routerLinkActive=""
        class="block px-4 py-2 text-primary-20 rounded-md hover:bg-surface-30 transition duration-200"
      >
        Invites
      </a>
      <div class="mt-auto break-all mb-0 p-4 border-t border-surface-40 text-light-0/80 text-sm">
        @if (userService.userProfile() !== null) {
          <p class="text-light-0/50">Logged in as:</p>
          <p class="text-light-0/80">{{ userService.userProfile()?.displayName }}</p>
        } @else if (userService.isLoading()) {
          <p>Loading...</p>
        } @else {
          <p>Not logged in</p>
        }
      </div>
    </nav>
  </aside>

  <div class="flex-1 overflow-y-auto p-8">
    <router-outlet></router-outlet>
  </div>
</div>
